name = "omarchy-live"
version = 4
root = "~/.config/hypr"
about = "Live Omarchy 4 customisation: Hyprland Lua config, the Omarchy shell, themes, terminal configs. Derived from omarchy-v5. Undo covers every file under the writable roots, bash included."
verify = "lua"
undo = "tree"

[policy]
read_roots = ["/usr/share/omarchy", "~/.config/omarchy", "~/.config/alacritty", "~/.config/ghostty", "~/.config/kitty", "~/.config/foot"]
write_roots = ["~/.config/omarchy", "~/.config/alacritty", "~/.config/ghostty", "~/.config/kitty", "~/.config/foot"]
rw_paths = ["~/.config/omarchy", "~/.config/alacritty", "~/.config/ghostty", "~/.config/kitty", "~/.config/foot"]

[policy.env]
OMARCHY_PATH = "/usr/share/omarchy"

[checks.lua]
run = "luac -p ~/.config/hypr/*.lua"
cwd = "."
about = "Lua syntax of the Hyprland config"
timeout = 30

[checks.json]
run = "python3 -m json.tool ~/.config/omarchy/shell.json >/dev/null"
cwd = "."
about = "shell.json is valid JSON"
timeout = 30

[[triggers]]
id = "hypr-guide"
on = "before:*"
match = "\\.config/hypr/"
action = "inject"
note = "Read /usr/share/omarchy/default/agents/skills/omarchy/hyprland.md first. Lua API; replace a bound key with o.rebind (same arguments as o.bind), disable one with hl.unbind; user validates via hyprctl reload && hyprctl configerrors."

[[triggers]]
id = "shell-guide"
on = "before:*"
match = "\\.config/omarchy/(shell\\.json|plugins/)"
action = "inject"
note = "Read /usr/share/omarchy/default/agents/skills/omarchy/plugins.md first. Bar is omarchy-shell, not Waybar; idle values are seconds. A new plugin goes in .config/omarchy/plugins/<id>/ with a manifest.json; read a built-in plugin's source under /usr/share/omarchy/shell/plugins/ for the patterns, and switch a plugin on by adding its id to shell.json (bar.layout for widgets, plugins for others). Run the validate and preview checks before finishing. Never edit packaged plugins."

[[triggers]]
id = "theme-hook-guide"
on = "before:*"
match = "\\.config/omarchy/(themes|themed|backgrounds|hooks)/"
action = "inject"
note = "Read theming.md (themes/backgrounds/templates) or hooks.md (hooks/<event>.d/) in /usr/share/omarchy/default/agents/skills/omarchy/ first."

[[triggers]]
id = "lua-syntax"
on = "after:edit"
match = "\\.lua$"
action = "require"
check = "lua"
note = "Lua config must pass luac -p; Hyprland breaks on syntax errors."

[[triggers]]
id = "lua-syntax-write"
on = "after:write"
match = "\\.lua$"
action = "require"
check = "lua"
note = "Lua config must pass luac -p; Hyprland breaks on syntax errors."

[[triggers]]
id = "json-syntax"
on = "after:edit"
match = "\\.json$"
action = "require"
check = "json"
note = "shell.json hot-reloads; invalid JSON breaks the bar."

[[triggers]]
id = "json-syntax-write"
on = "after:write"
match = "\\.json$"
action = "require"
check = "json"
note = "shell.json hot-reloads; invalid JSON breaks the bar."

[[triggers]]
id = "plugin-habits"
on = "before:*"
match = "\\.config/omarchy/plugins/"
action = "inject"
note = "Plugin habits a reviewer checks: run commands as an argv list (Quickshell.execDetached([...]) or Process.command = [...]), never a bash -c string; restore anything the plugin changed on the desktop in Component.onDestruction; report what actually happened, not what was asked for; give every setting a fallback against missing or bad values and a manifest default with min/max; hide a widget until its first reading; read the current value instead of assuming a default; find other widgets through the shell's registry, not by file path or underscore-prefixed internals; add nothing the person did not ask for."

[[triggers]]
id = "no-refresh"
on = "before:bash"
match = "omarchy[- ](refresh|reinstall)\\b"
action = "block"
note = "refresh/reinstall overwrite user config. Ask the user for explicit confirmation before running."
