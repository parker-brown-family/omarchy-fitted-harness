name = "omarchy-v5"
version = 5
root = "./evals/omarchy/fixture/home"
about = "A user's home-directory dotfiles (~/.config) for customizing an Omarchy 4 Arch/Hyprland desktop: Lua Hyprland config, the Omarchy shell bar, terminals, themes and hooks."
verify = "build"

[policy]
read_roots = ["/usr/share/omarchy", "{fitting_dir}/preview"]
ro_paths = ["/usr/share/omarchy", "{fitting_dir}/preview"]

[policy.env]
OMARCHY_PATH = "/usr/share/omarchy"

[checks.lua]
run = "find .config -name '*.lua' -print0 | xargs -0 -r luac -p"
cwd = "."
about = "Lua syntax of all user Lua configs"
timeout = 30

[checks.json]
run = "find .config -name '*.json' -print0 | while IFS= read -r -d '' f; do python3 -m json.tool \"$f\" >/dev/null || { echo \"bad JSON: $f\"; exit 1; }; done"
cwd = "."
about = "Validate strict JSON files like shell.json"
timeout = 30

[checks.toml]
run = """find .config -name '*.toml' -print0 | xargs -0 -r python3 -c 'import sys,tomllib
for f in sys.argv[1:]:
  tomllib.load(open(f,"rb"))'"""
cwd = "."
about = "Parse TOML files (alacritty, theme colors)"
timeout = 30

[checks.shell]
run = "find .config -name '*.sh' -o -path '*/hooks/*' -type f | while IFS= read -r f; do bash -n \"$f\" || exit 1; done"
cwd = "."
about = "bash -n on scripts and hooks"
timeout = 30

[checks.all]
run = "find .config -name '*.lua' -print0 | xargs -0 -r luac -p && find .config -name '*.json' -print0 | while IFS= read -r -d '' f; do python3 -m json.tool \"$f\" >/dev/null || { echo \"bad JSON: $f\"; exit 1; }; done"
cwd = "."
about = "Lua and JSON syntax across .config"
timeout = 60

[checks.validate]
run = "found=0; for d in .config/omarchy/plugins/*/; do [ -f \"$d/manifest.json\" ] || continue; found=1; omarchy-plugin-validate \"$d\" && echo \"valid: $d\" || exit 1; done; [ $found = 1 ] || echo 'no plugins under .config/omarchy/plugins'"
cwd = "."
about = "Omarchy's own omarchy-plugin-validate on every plugin under .config/omarchy/plugins (the schema the shell enforces)"
timeout = 60

[checks.preview]
run = "python3 {fitting_dir}/preview/preview.py"
cwd = "."
about = "Load every plugin entry point in Quickshell offscreen: prints QML errors from the plugin's files and the text each bar widget drew. Theme: run preview.py --theme <dir> through bash"
timeout = 300

[checks.build]
run = "find .config -name '*.json' -print0 | while IFS= read -r -d '' f; do python3 -m json.tool \"$f\" >/dev/null || { echo \"bad JSON: $f\"; exit 1; }; done && for d in .config/omarchy/plugins/*/; do [ -f \"$d/manifest.json\" ] || continue; omarchy-plugin-validate \"$d\" || exit 1; done && if ls .config/omarchy/plugins/*/manifest.json >/dev/null 2>&1; then python3 {fitting_dir}/preview/preview.py; fi"
cwd = "."
about = "JSON syntax, then validate and preview for any plugins"
timeout = 300

[[triggers]]
id = "hypr-guide"
on = "before:*"
match = "\\.config/hypr/"
action = "inject"
note = "Read /usr/share/omarchy/default/agents/skills/omarchy/hyprland.md first. Lua API; replace a bound key with o.rebind (same arguments as o.bind), disable one with hl.unbind; user validates via hyprctl reload && hyprctl configerrors."

[[triggers]]
id = "shell-guide"
on = "before:*"
match = "\\.config/omarchy/(shell\\.json|plugins/)"
action = "inject"
note = "Read /usr/share/omarchy/default/agents/skills/omarchy/plugins.md first. Bar is omarchy-shell, not Waybar; idle values are seconds. A new plugin goes in .config/omarchy/plugins/<id>/ with a manifest.json; read a built-in plugin's source under /usr/share/omarchy/shell/plugins/ for the patterns, and switch a plugin on by adding its id to shell.json (bar.layout for widgets, plugins for others). Run the validate and preview checks before finishing. Never edit packaged plugins."

[[triggers]]
id = "theme-hook-guide"
on = "before:*"
match = "\\.config/omarchy/(themes|themed|backgrounds|hooks)/"
action = "inject"
note = "Read theming.md (themes/backgrounds/templates) or hooks.md (hooks/<event>.d/) in /usr/share/omarchy/default/agents/skills/omarchy/ first."

[[triggers]]
id = "lua-syntax"
on = "after:edit"
match = "\\.lua$"
action = "require"
check = "lua"
note = "Lua config must pass luac -p; Hyprland breaks on syntax errors."

[[triggers]]
id = "lua-syntax-write"
on = "after:write"
match = "\\.lua$"
action = "require"
check = "lua"
note = "Lua config must pass luac -p; Hyprland breaks on syntax errors."

[[triggers]]
id = "json-syntax"
on = "after:edit"
match = "\\.json$"
action = "require"
check = "json"
note = "shell.json hot-reloads; invalid JSON breaks the bar."

[[triggers]]
id = "json-syntax-write"
on = "after:write"
match = "\\.json$"
action = "require"
check = "json"
note = "shell.json hot-reloads; invalid JSON breaks the bar."

[[triggers]]
id = "plugin-habits"
on = "before:*"
match = "\\.config/omarchy/plugins/"
action = "inject"
note = "Plugin habits a reviewer checks: run commands as an argv list (Quickshell.execDetached([...]) or Process.command = [...]), never a bash -c string; restore anything the plugin changed on the desktop in Component.onDestruction; report what actually happened, not what was asked for; give every setting a fallback against missing or bad values and a manifest default with min/max; hide a widget until its first reading; read the current value instead of assuming a default; find other widgets through the shell's registry, not by file path or underscore-prefixed internals; add nothing the person did not ask for."

[[triggers]]
id = "no-refresh"
on = "before:bash"
match = "omarchy[- ](refresh|reinstall)\\b"
action = "block"
note = "refresh/reinstall overwrite user config. Ask the user for explicit confirmation before running."
