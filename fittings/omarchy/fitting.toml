name = "omarchy"
version = 1
root = "./evals/omarchy/fixture/home"
about = "A user's home-directory dotfiles (~/.config) for customizing an Omarchy 4.0.4 Arch/Hyprland desktop: Lua Hyprland config, the Omarchy shell bar, terminals, themes and hooks."
verify = "all"

[policy]
read_roots = ["/usr/share/omarchy"]
ro_paths = ["/usr/share/omarchy"]

[policy.env]
OMARCHY_PATH = "/usr/share/omarchy"

[checks.lua]
run = "find .config -name '*.lua' -print0 | xargs -0 -r luac -p"
cwd = "."
about = "Lua syntax of all user Lua configs"
timeout = 30

[checks.json]
run = "find .config -name '*.json' -print0 | while IFS= read -r -d '' f; do python3 -m json.tool \"$f\" >/dev/null || { echo \"bad JSON: $f\"; exit 1; }; done"
cwd = "."
about = "Validate strict JSON files like shell.json"
timeout = 30

[checks.toml]
run = """find .config -name '*.toml' -print0 | xargs -0 -r python3 -c 'import sys,tomllib
for f in sys.argv[1:]:
  tomllib.load(open(f,"rb"))'"""
cwd = "."
about = "Parse TOML files (alacritty, theme colors)"
timeout = 30

[checks.shell]
run = "find .config -name '*.sh' -o -path '*/hooks/*' -type f | while IFS= read -r f; do bash -n \"$f\" || exit 1; done"
cwd = "."
about = "bash -n on scripts and hooks"
timeout = 30

[checks.all]
run = "find .config -name '*.lua' -print0 | xargs -0 -r luac -p && find .config -name '*.json' -print0 | while IFS= read -r -d '' f; do python3 -m json.tool \"$f\" >/dev/null || { echo \"bad JSON: $f\"; exit 1; }; done"
cwd = "."
about = "Lua and JSON syntax across .config"
timeout = 60

[[triggers]]
id = "hypr-guide"
on = "before:edit"
match = "\\.config/hypr/"
action = "inject"
note = "Read /usr/share/omarchy/default/agents/skills/omarchy/hyprland.md first. Lua API; rebinding needs hl.unbind before o.bind; user validates via hyprctl reload && hyprctl configerrors."

[[triggers]]
id = "shell-guide"
on = "before:edit"
match = "\\.config/omarchy/(shell\\.json|plugins/)"
action = "inject"
note = "Read /usr/share/omarchy/default/agents/skills/omarchy/plugins.md first. Bar is omarchy-shell, not Waybar; idle values are seconds; clone built-in plugins, never edit packaged ones."

[[triggers]]
id = "theme-hook-guide"
on = "before:write"
match = "\\.config/omarchy/(themes|themed|backgrounds|hooks)/"
action = "inject"
note = "Read theming.md (themes/backgrounds/templates) or hooks.md (hooks/<event>.d/) in /usr/share/omarchy/default/agents/skills/omarchy/ first."

[[triggers]]
id = "lua-syntax"
on = "after:edit"
match = "\\.lua$"
action = "require"
check = "lua"
note = "Lua config must pass luac -p; Hyprland breaks on syntax errors."

[[triggers]]
id = "json-syntax"
on = "after:edit"
match = "\\.json$"
action = "require"
check = "json"
note = "shell.json hot-reloads; invalid JSON breaks the bar."

[[triggers]]
id = "no-refresh"
on = "before:bash"
match = "omarchy[- ](refresh|reinstall)\\b"
action = "block"
note = "refresh/reinstall overwrite user config. Ask the user for explicit confirmation before running."
